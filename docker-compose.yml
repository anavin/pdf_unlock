services:
  pdf-unlock:
    build: .
    container_name: pdf-unlock
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - TZ=Asia/Bangkok
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
