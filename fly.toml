# fly.toml - Fly.io configuration
# ก่อนใช้: fly launch --no-deploy เพื่อให้ Fly สร้าง app และเปลี่ยนชื่อให้ unique
# จากนั้น: fly deploy

app = "pdf-unlock"  # เปลี่ยนเป็นชื่อที่ unique ของคุณเอง
primary_region = "sin"  # Singapore - ใกล้ไทยที่สุด

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"   # หยุด VM เมื่อไม่มี traffic (ประหยัด)
  auto_start_machines = true     # เปิดใหม่เมื่อมี request เข้ามา
  min_machines_running = 0       # 0 = ใช้ free tier เต็มที่
  processes = ["app"]

[http_service.concurrency]
  type = "requests"
  hard_limit = 250
  soft_limit = 200

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
